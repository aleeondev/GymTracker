# ==========================================================
# Perfil "prod": la app publicada en Render (lo activa el Dockerfile).
# Se suma a application.properties. Las credenciales llegan como variables
# de entorno de Render: DB_URL, DB_USERNAME, DB_PASSWORD, SUPABASE_SECRET_KEY.
# ==========================================================

# Render decide el puerto y lo pasa en la variable PORT
server.port=${PORT:8080}

# Render recibe las visitas por HTTPS y nos las pasa por dentro en HTTP.
# Con esto Spring sabe que el original era HTTPS: las redirecciones salen con
# https:// y las cookies (sesión, CSRF) se marcan como "Secure".
server.forward-headers-strategy=framework

# Supabase gratis admite 15 conexiones a la vez: la app usa como mucho 5
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Respuestas comprimidas: la web carga antes en el móvil
server.compression.enabled=true

logging.level.root=INFO
