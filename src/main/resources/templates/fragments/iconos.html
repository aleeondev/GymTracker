<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    ICONOS PROPIOS de Gym Tracker (SVG). Mismo estilo que los de la barra inferior:
    trazo de 2 px, esquinas redondeadas, sin relleno. Toman el color del texto.
    Uso:  <svg th:replace="~{fragments/iconos :: icono('trofeo')}"></svg>
    Para añadir uno: un nuevo <path th:case="'nombre'" ...> (dibujado en 24 x 24).
-->
<body>
<svg th:fragment="icono(nombre)" class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <th:block th:switch="${nombre}">
        <!-- Trofeo: récords -->
        <path th:case="'trofeo'" d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 6h3v1a3 3 0 0 1-3 3M7 6H4v1a3 3 0 0 0 3 3"/>
        <!-- Barra con discos: entrenar, calculadora -->
        <path th:case="'pesa'" d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/>
        <!-- Destello: recomendado -->
        <path th:case="'destello'" d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7L19 16z"/>
        <!-- Repetir -->
        <path th:case="'repetir'" d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5M20 12a8 8 0 0 1-13.7 5.6L4 15M4 20v-5h5"/>
        <!-- Nutrición: manzana -->
        <path th:case="'nutricion'" d="M12 7.5c-1.6-1.4-6-1.6-6 3.5 0 4.2 2.9 9 5 9 .5 0 .7-.3 1-.3s.5.3 1 .3c2.1 0 5-4.8 5-9 0-5.1-4.4-4.9-6-3.5zM12 7.5c0-2 .8-3.6 3-4.5"/>
        <!-- Coach IA: bocadillo de chat con chispa -->
        <path th:case="'coach'" d="M21 12a8.5 8.5 0 0 1-12.4 7.6L4 21l1.3-4.3A8.5 8.5 0 1 1 21 12zM12 8.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9.9-2.6z"/>
        <!-- Candado: clasificado / bloqueado -->
        <path th:case="'candado'" d="M6 11h12v10H6zM8.5 11V7.5a3.5 3.5 0 0 1 7 0V11M12 15v2"/>
        <!-- Gráfica: progreso -->
        <path th:case="'grafica'" d="M4 20h16M4 20V4M8 16l4-5 3 3 5-7"/>
        <!-- Check: hecho, correcto -->
        <path th:case="'check'" d="M5 12.5l4.5 4.5L19 7.5"/>
        <!-- Flecha a la derecha -->
        <path th:case="'flecha'" d="M5 12h14M13 6l6 6-6 6"/>
        <!-- Compartir -->
        <path th:case="'compartir'" d="M12 3v12M7.5 7.5L12 3l4.5 4.5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>
        <!-- Rayo: velocidad, racha -->
        <path th:case="'rayo'" d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>
        <!-- Insignia (medalla): recompensas y logros -->
        <path th:case="'insignia'" d="M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM8.5 13.9L7 22l5-3 5 3-1.5-8.1M12 6.5l1 2 2.2.3-1.6 1.5.4 2.2-2-1-2 1 .4-2.2-1.6-1.5 2.2-.3 1-2z"/>
        <!-- Reloj: tiempo -->
        <path th:case="'reloj'" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2"/>
    </th:block>
</svg>
</body>
</html>
