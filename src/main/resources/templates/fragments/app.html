<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    Piezas comunes de todas las páginas de la app (las que requieren sesión).
    Cada página las incluye con th:replace, por ejemplo:
      <head th:replace="~{fragments/app :: head('Mis rutinas')}"></head>
      <header th:replace="~{fragments/app :: cabecera}"></header>
-->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#c92f4b">
    <title th:text="${titulo} + ' | Gym Tracker'">Gym Tracker</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="icon" th:href="@{/img/favicon.ico}" sizes="any">
    <link rel="apple-touch-icon" th:href="@{/img/favicon-180.png}">
    <!-- App instalable (PWA): ficha de la app e icono/barra en iPhone -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Gym Tracker">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<!-- CABECERA
     Fila 1: logo, ÁREAS de la app (Panel · Entrenamiento · Nutrición · Coach IA) y usuario.
     Fila 2 (solo dentro de Entrenamiento): barra secundaria con sus apartados.
     "area" lo calcula DatosComunesAdvice a partir de la dirección actual. -->
<header th:fragment="cabecera" class="app-header">
    <a class="logo" th:href="@{/dashboard}">Gym Tracker</a>
    <nav class="app-nav" aria-label="Áreas de la app">
        <a th:href="@{/dashboard}" th:classappend="${area == 'panel'} ? 'activo'">Panel</a>
        <a th:href="@{/entrenamiento}" th:classappend="${area == 'entreno'} ? 'activo'">Entrenamiento</a>
        <a th:href="@{/nutricion}" th:classappend="${area == 'nutricion'} ? 'activo'">Nutrición</a>
        <a th:href="@{/coach}" th:classappend="${area == 'coach'} ? 'activo'">Coach IA</a>
    </nav>
    <div class="app-usuario">
        <!-- Avatar + nombre: enlace a "Mi perfil" (en móvil solo se ve el avatar) -->
        <a class="app-perfil" th:href="@{/perfil}" th:classappend="${rutaActual == '/perfil'} ? 'activo'" title="Mi perfil">
            <span class="app-avatar" aria-hidden="true"
                  th:text="${usuarioNombre != null and !#strings.isEmpty(usuarioNombre)} ? ${#strings.toUpperCase(#strings.substring(usuarioNombre, 0, 1))} : 'G'">A</span>
            <span class="app-usuario-nombre" th:text="${usuarioNombre}">Alex</span>
            <span class="sr-only">Mi perfil</span>
        </a>
        <button type="button" class="btn-salir" data-cerrar-sesion>Salir</button>
    </div>

    <!-- BARRA SECUNDARIA del área Entrenamiento (en móvil se desliza de lado) -->
    <nav class="subnav" th:if="${area == 'entreno'}" aria-label="Entrenamiento">
        <a th:href="@{/entrenamiento}" th:classappend="${#strings.startsWith(rutaActual, '/entrenamiento')} ? 'activo'">Entrenar</a>
        <a th:href="@{/rutinas}" th:classappend="${#strings.startsWith(rutaActual, '/rutinas')} ? 'activo'">Rutinas</a>
        <a th:href="@{/historial}" th:classappend="${#strings.startsWith(rutaActual, '/historial')} ? 'activo'">Historial</a>
        <a th:href="@{/progreso}" th:classappend="${#strings.startsWith(rutaActual, '/progreso')} ? 'activo'">Progreso</a>
        <a th:href="@{/records}" th:classappend="${#strings.startsWith(rutaActual, '/records')} ? 'activo'">Récords</a>
        <a th:href="@{/ejercicios}" th:classappend="${#strings.startsWith(rutaActual, '/ejercicios')} ? 'activo'">Ejercicios</a>
    </nav>
</header>

<!-- BARRA INFERIOR (móvil): Panel · Entreno · [ENTRENAR] · Nutrición · Coach -->
<nav th:fragment="tabbar" class="tabbar" aria-label="Navegación móvil">
    <a th:href="@{/dashboard}" th:classappend="${area == 'panel'} ? 'activo'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Panel</span>
    </a>
    <a th:href="@{/rutinas}" th:classappend="${area == 'entreno' and !#strings.startsWith(rutaActual, '/entrenamiento')} ? 'activo'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Entreno</span>
    </a>
    <a class="tabbar-principal" th:href="@{/entrenamiento}" th:classappend="${#strings.startsWith(rutaActual, '/entrenamiento')} ? 'activo'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>
        <span>Entrenar</span>
    </a>
    <a th:href="@{/nutricion}" th:classappend="${area == 'nutricion'} ? 'activo'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.5c-1.6-1.4-6-1.6-6 3.5 0 4.2 2.9 9 5 9 .5 0 .7-.3 1-.3s.5.3 1 .3c2.1 0 5-4.8 5-9 0-5.1-4.4-4.9-6-3.5zM12 7.5c0-2 .8-3.6 3-4.5"/></svg>
        <span>Nutrición</span>
    </a>
    <a th:href="@{/coach}" th:classappend="${area == 'coach'} ? 'activo'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.4 7.6L4 21l1.3-4.3A8.5 8.5 0 1 1 21 12z"/></svg>
        <span>Coach</span>
    </a>
</nav>

<!-- MENSAJES (éxito / error) que mandan los controladores con addFlashAttribute -->
<th:block th:fragment="avisos">
    <div class="aviso aviso-exito" th:if="${exito}" role="status" th:text="${exito}">Guardado.</div>
    <div class="aviso aviso-error" th:if="${error}" role="alert" th:text="${error}">Error.</div>
</th:block>

<footer th:fragment="pie" class="app-footer">
    <span>© 2026 Gym Tracker · v1.0 alpha</span>
    <span>Entrena · Registra · Evoluciona</span>
</footer>

<!-- SCRIPTS comunes: Supabase (copia local en /js/vendor), sesión y utilidades -->
<th:block th:fragment="scripts">
    <script th:src="@{/js/vendor/supabase-2.117.2.min.js}"></script>
    <script th:src="@{/js/supabase.js}"></script>
    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/pwa.js}"></script>
</th:block>

</html>
