<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">

    <title>Crear cuenta | Gym Tracker</title>

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>
    <main class="auth-page">
        <section class="auth-card">
            <a href="/" class="auth-logo">
                Gym Tracker
            </a>

            <h1>Crear cuenta</h1>

            <p class="auth-subtitle">
                Crea tu cuenta y empieza a llevar el control de tus entrenamientos.
            </p>

            <form id="registroForm">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Tu nombre"
                    autocomplete="name"
                    required
                >

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="tu@email.com"
                    autocomplete="email"
                    required
                >

                <label for="password">
                    Contraseña
                </label>

                <div class="password-field">
                    <input
                        type="password"
                        id="password"
                        placeholder="Mínimo 6 caracteres"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        data-target="password"
                        aria-label="Mostrar contraseña"
                    >
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.4 21.4 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.4 21.4 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
                <button type="submit" class="button" id="submitBtn"> Crear cuenta </button>
            </form>
            <p id="mensaje" class="auth-message" role="status" aria-live="polite"></p>
            <div class="auth-footer">
                ¿Ya tienes una cuenta?
                <a href="/login">Inicia sesión</a>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth-ui.js"></script>
    <script src="/js/registro.js"></script>
</body>
</html>
