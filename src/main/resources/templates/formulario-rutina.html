<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app :: head(${rutina.id == null} ? 'Nueva rutina' : 'Editar rutina')}"></head>
<body class="app">
    <header th:replace="~{fragments/app :: cabecera}"></header>
    <main>
        <div class="form-card">
            <a class="volver" th:href="${rutina.id == null} ? @{/rutinas} : @{/rutinas/{id}(id=${rutina.id})}">← Volver</a>
            <th:block th:replace="~{fragments/app :: avisos}"></th:block>
            <div class="page-head">
                <div>
                    <span class="eyebrow" th:text="${rutina.id == null} ? 'NUEVA RUTINA' : 'EDITAR RUTINA'">NUEVA RUTINA</span>
                    <h1 th:text="${rutina.id == null} ? 'Crear rutina' : ${rutina.nombre}">Crear rutina</h1>
                    <p>Después podrás añadirle ejercicios con sus series, repeticiones y pesos.</p>
                </div>
            </div>
            <div class="panel">
                <form th:action="@{/rutinas/guardar}" th:object="${rutina}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <label for="nombre">Nombre de la rutina</label>
                    <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Pecho y tríceps" maxlength="100" required>
                    <label for="descripcion">Descripción (opcional)</label>
                    <textarea id="descripcion" th:field="*{descripcion}" rows="4" maxlength="1000" placeholder="Describe brevemente esta rutina..."></textarea>
                    <div class="form-acciones">
                        <button class="button" type="submit">Guardar rutina</button>
                        <a class="button button-secundario" th:href="${rutina.id == null} ? @{/rutinas} : @{/rutinas/{id}(id=${rutina.id})}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/app :: pie}"></footer>
    <nav th:replace="~{fragments/app :: tabbar}"></nav>
    <th:block th:replace="~{fragments/app :: scripts}"></th:block>
</body>
</html>
