<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio - Gym Tracker</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a class="logo" th:href="@{/}">Gym Tracker</a>
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/ejercicios}">Ejercicios</a>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h2>Nuevo ejercicio</h2>
            <form th:action="@{/ejercicios/guardar}" th:object="${ejercicio}" method="post">
                <input type="hidden" th:field="*{id}">
                <label>Nombre</label>
                <input type="text" th:field="*{nombre}" required>
                <label>Grupo Muscular</label>
                <input type="text" th:field="*{grupoMuscular}" placeholder="Pecho, espalda, pierna...">
                <label>Descripción</label>
                <textarea th:field="*{descripcion}" rows="5"></textarea>
                <label>Máquina / equipamiento</label>
                <input type="text" th:field="*{equipamiento}" placeholder="Polea, máquina, barra, mancuernas...">

                <button class="button" type="submit">Guardar ejercicio</button>
            </form>
        </section>
    </main>
</body>
</html>
