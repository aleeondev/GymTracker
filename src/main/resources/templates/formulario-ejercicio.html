<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app :: head(${ejercicio.id == null} ? 'Nuevo ejercicio' : 'Editar ejercicio')}"></head>
<body class="app">
    <header th:replace="~{fragments/app :: cabecera}"></header>
    <main>
        <div class="form-card">
            <a class="volver" th:href="${volver != null} ? ${volver} : @{/ejercicios}">← Volver</a>
            <th:block th:replace="~{fragments/app :: avisos}"></th:block>
            <div class="page-head">
                <div>
                    <span class="eyebrow" th:text="${ejercicio.id == null} ? 'NUEVO EJERCICIO' : 'EDITAR EJERCICIO'">NUEVO EJERCICIO</span>
                    <h1 th:text="${ejercicio.id == null} ? 'Crear ejercicio' : ${ejercicio.nombre}">Crear ejercicio</h1>
                </div>
            </div>
            <div class="panel">
                <form th:action="@{/ejercicios/guardar}" th:object="${ejercicio}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" name="volver" th:if="${volver != null}" th:value="${volver}">

                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" maxlength="100" placeholder="Ej. Press banca en multipower" required>

                    <div class="campos-2">
                        <div>
                            <label for="grupoMuscular">Grupo muscular</label>
                            <select id="grupoMuscular" th:field="*{grupoMuscular}" required>
                                <option value="">Selecciona...</option>
                                <option th:each="g : ${grupos}" th:value="${g}" th:text="${g}">Pecho</option>
                            </select>
                        </div>
                        <div>
                            <label for="equipamiento">Máquina / equipamiento</label>
                            <input type="text" id="equipamiento" th:field="*{equipamiento}" maxlength="100" placeholder="Barra, mancuernas, polea...">
                        </div>
                    </div>

                    <label for="descripcion">Descripción (opcional)</label>
                    <textarea id="descripcion" th:field="*{descripcion}" rows="4" maxlength="1000" placeholder="Técnica, ajustes de la máquina..."></textarea>

                    <div class="form-acciones">
                        <button class="button" type="submit">Guardar ejercicio</button>
                        <a class="button button-secundario" th:href="${volver != null} ? ${volver} : @{/ejercicios}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/app :: pie}"></footer>
    <nav th:replace="~{fragments/app :: tabbar}"></nav>
    <th:block th:replace="~{fragments/app :: scripts}"></th:block>
</body>
</html>
