<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios - Gym Tracker</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a class="logo" th:href="@{/}">Gym Tracker</a>
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/rutinas}">Rutinas</a>
            <a th:href="@{/entrenamiento}">Entrenamiento</a>
            <a th:href="@{/historial}">Historial</a>
            <a th:href="@{/ejercicios}">Ejercicios</a>
        </nav>
    </header>
    <main>
        <div class="page-header">
            <div>
                <h2>Mis ejercicios</h2>
                <p>Gestiona tus ejercicios y equipamiento.</p>
            </div>
            <a class="button" th:href="@{/ejercicios/nuevo}">+ Añadir ejercicio</a>
        </div>

        <div class="cards">
            <div class="card" th:each="ejercicio : ${ejercicios}">
                <h3 th:text="${ejercicio.nombre}">Press banca</h3>
                <div class="exercise-info">
                    <p>
                        <strong>Grupo muscular</strong>
                        <span th:text="${ejercicio.grupoMuscular}">Pecho</span>
                    </p>
                    <p>
                        <strong>Equipamiento</strong>
                        <span th:text="${ejercicio.equipamiento}">Máquina</span>
                    </p>
                </div>
                <p class="exercise-description" th:text="${ejercicio.descripcion}">Descripción del ejercicio.</p>
                <div class="card-buttons">
                    <a class="button" th:href="@{/ejercicios/editar/{id}(id=${ejercicio.id})}">Editar</a>
                    <a class="button button-delete" th:href="@{/ejercicios/eliminar/{id}(id=${ejercicio.id})}">Eliminar</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
