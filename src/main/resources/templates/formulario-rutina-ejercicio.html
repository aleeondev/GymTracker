<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir ejercicio - Gym Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/rutinas.css}">
</head>

<body>
    <header>
        <a class="logo" th:href="@{/}">Gym Tracker</a>
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/rutinas}">Rutinas</a>
            <a th:href="@{/ejercicios}">Ejercicios</a>
        </nav>
    </header>
    <main>
        <div class="routine-form-container">
            <div class="routine-form-card">
                <p class="routine-label">AÑADIR EJERCICIO</p>
                <h2 th:text="${rutina.nombre}">Pecho y tríceps</h2>
                <p class="form-description">Configura cómo quieres realizar este ejercicio dentro de la rutina.</p>
                <form th:action="@{/rutinas/{id}/ejercicios/guardar(id=${rutina.id})}" th:object="${rutinaEjercicio}"
                    method="post">
                    <!-- TIPO DE RUTINA // GRUPO MUSCULAR-->
                    <label for="grupoMuscular">Grupo muscular</label>
                    <select id="grupoMuscular" class="form-select" required>
                        <option value="">Selecciona un grupo muscular</option>
                        <option value="Pecho">Pecho</option>
                        <option value="Espalda">Espalda</option>
                        <option value="Hombros">Hombros</option>
                        <option value="Tríceps">Tríceps</option>
                        <option value="Cuádriceps">Cuádriceps</option>
                        <option value="Femoral">Femoral</option>
                        <option value="Glúteos">Glúteos</option>
                        <option value="Gemelos">Gemelos</option>
                        <option value="Abdomen">Abdomen</option>
                    </select>

                    <!-- EJERCICIO -->
                    <label for="ejercicio">Ejercicio</label>
                    <select id="ejercicio" th:field="*{ejercicio.id}" class="form-select" required>
                        <option value="">Primero selecciona un grupo muscular</option>
                        <option th:each="ejercicio : ${ejercicios}" th:value="${ejercicio.id}"
                            th:text="${ejercicio.nombre}" th:attr="data-grupo=${ejercicio.grupoMuscular}"></option>
                    </select>

                    <!-- SERIES -->
                    <label for="series">Series</label>
                    <input type="number" id="series" th:field="*{series}" min="1" placeholder="Ej. 4" required>

                    <!-- REPETICIONES -->
                    <label for="repeticiones">Repeticiones</label>
                    <input type="number" id="repeticiones" th:field="*{repeticiones}" min="1" placeholder="Ej. 8"
                        required>

                    <!-- PESO -->
                    <label for="pesoObjetivo">Peso objetivo (Kgs)</label>
                    <input type="number" id="pesoObjetivo" th:field="*{pesoObjetivo}" min="0" step="0.5"
                        placeholder="Ej. 60">

                    <!-- DESCANSO -->
                    <label for="descanso">Descanso</label>
                    <input type="number" id="descanso" th:field="*{descanso}" min="0" placeholder="Ej. 120">

                    <div class="form-buttons">
                        <button class="button" type="submit">Añadir ejercicio</button>
                        <a class="button button-delete" th:href="@{/rutinas/{id}(id=${rutina.id})}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script>
        var grupoMuscular = document.getElementById("grupoMuscular");
        var ejercicio = document.getElementById("ejercicio");

        function filtrarEjercicios() {
            var grupoSeleccionado = grupoMuscular.value;
            var opciones = ejercicio.getElementsByTagName("option");

            for (var i = 0; i < opciones.length; i++) {
                var opcion = opciones[i];

                if (opcion.value === "") {
                    // Opción por defecto ("Primero selecciona...")
                    opcion.hidden = false;
                    opcion.disabled = false;
                } else {
                    var grupoEjercicio = opcion.getAttribute("data-grupo");
                    // Si coincide el grupo se muestra, si no hay grupo seleccionado o no coincide se oculta
                    if (grupoSeleccionado && grupoEjercicio === grupoSeleccionado) {
                        opcion.hidden = false;
                        opcion.disabled = false;
                    } else {
                        opcion.hidden = true;
                        opcion.disabled = true;
                    }
                }
            }
            ejercicio.value = "";
        }

        // Ejecuta el filtrado al cambiar de opción
        grupoMuscular.addEventListener("change", filtrarEjercicios);

        // Ejecuta el filtrado inmediatamente al cargar la página
        document.addEventListener("DOMContentLoaded", filtrarEjercicios);
    </script>
</body>
</html>
