<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app :: head('Ejercicio de la rutina')}"></head>
<body class="app">
    <header th:replace="~{fragments/app :: cabecera}"></header>
    <main>
        <div class="form-card">
            <a class="volver" th:href="@{/rutinas/{id}(id=${rutina.id})}">← Volver a la rutina</a>
            <div class="page-head">
                <div>
                    <span class="eyebrow" th:text="${rutinaEjercicio.id == null} ? 'AÑADIR EJERCICIO' : 'EDITAR EJERCICIO'">AÑADIR EJERCICIO</span>
                    <h1 th:text="${rutina.nombre}">Pecho y tríceps</h1>
                    <p>Elige el ejercicio y cómo quieres hacerlo dentro de esta rutina.</p>
                </div>
            </div>
            <div class="panel">
                <form th:action="@{/rutinas/{id}/ejercicios/guardar(id=${rutina.id})}" th:object="${rutinaEjercicio}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <label for="grupoMuscular">Grupo muscular</label>
                    <select id="grupoMuscular">
                        <option value="">Todos los grupos</option>
                        <option th:each="g : ${grupos}" th:value="${g}" th:text="${g}">Pecho</option>
                    </select>

                    <label for="ejercicio">Ejercicio</label>
                    <select id="ejercicio" name="ejercicioId" required>
                        <option value="">Selecciona un ejercicio</option>
                        <option th:each="e : ${ejercicios}" th:value="${e.id}"
                                th:text="${e.nombre} + (${e.esComun()} ? '' : ' (mío)')"
                                th:attr="data-grupo=${e.grupoMuscular}"
                                th:selected="${e.id == ejercicioSeleccionado}">Press banca</option>
                    </select>
                    <p class="ayuda">¿No está el que buscas?
                        <a class="enlace" th:href="@{/ejercicios/nuevo(volver=${'/rutinas/' + rutina.id + '/ejercicios/nuevo'})}">Crea un ejercicio nuevo</a>
                    </p>

                    <div class="campos-2">
                        <div>
                            <label for="series">Series</label>
                            <input type="number" id="series" th:field="*{series}" min="1" max="20" inputmode="numeric" required>
                        </div>
                        <div>
                            <label for="repeticiones">Repeticiones</label>
                            <input type="number" id="repeticiones" th:field="*{repeticiones}" min="1" max="100" inputmode="numeric" required>
                        </div>
                        <div>
                            <label for="pesoObjetivo">Peso objetivo (kg)</label>
                            <input type="number" id="pesoObjetivo" th:field="*{pesoObjetivo}" min="0" max="1500" step="0.25" inputmode="decimal" placeholder="Opcional">
                        </div>
                        <div>
                            <label for="descanso">Descanso (segundos)</label>
                            <input type="number" id="descanso" th:field="*{descanso}" min="0" max="900" step="15" inputmode="numeric">
                        </div>
                    </div>

                    <div class="form-acciones">
                        <button class="button" type="submit" th:text="${rutinaEjercicio.id == null} ? 'Añadir a la rutina' : 'Guardar cambios'">Añadir a la rutina</button>
                        <a class="button button-secundario" th:href="@{/rutinas/{id}(id=${rutina.id})}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/app :: pie}"></footer>
    <nav th:replace="~{fragments/app :: tabbar}"></nav>
    <th:block th:replace="~{fragments/app :: scripts}"></th:block>
    <script th:src="@{/js/rutina-ejercicio.js}"></script>
</body>
</html>
