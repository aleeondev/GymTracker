<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">

    <title>Iniciar sesión | Gym Tracker</title>

    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="icon" href="/img/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/img/favicon-180.png">
    <meta name="theme-color" content="#c92f4b">
    <!-- App instalable (PWA): ficha de la app e icono/barra en iPhone -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Gym Tracker">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>
    <main class="auth-page">
        <aside th:replace="~{fragments/auth :: escena('Tu próxima serie te está esperando.', 'Entra y sigue donde lo dejaste: tus rutinas, tus récords y todo tu progreso.')}"></aside>
        <section class="auth-card">
            <p class="auth-saludo" data-saludo></p>
            <h1>Iniciar sesión</h1>
            <p class="auth-subtitle">Entra en tu cuenta para continuar con tus entrenamientos.</p>

            <form id="loginForm">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="name@email.com" autocomplete="email" required>
                <label for="password">Contraseña</label>
                <div class="password-field">
                    <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar contraseña">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.4 21.4 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.4 21.4 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
                <a class="auth-olvido" href="/recuperar">¿Has olvidado tu contraseña?</a>

                <button type="submit" class="button" id="submitBtn">Iniciar sesión</button>
            </form>
            <p id="mensaje" class="auth-message" role="status" aria-live="polite"></p>
            <div class="auth-footer">
                ¿Todavía no tienes una cuenta?
                <a href="/registro">Crear cuenta</a>
            </div>
        </section>
    </main>
    <script th:src="@{/js/enlace-error-redirect.js}"></script>
    <script th:src="@{/js/vendor/supabase-2.117.2.min.js}"></script>
    <script th:src="@{/js/supabase.js}"></script>
    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/auth-ui.js}"></script>
    <script th:src="@{/js/pwa.js}"></script>
    <script th:src="@{/js/login.js}"></script>
</body>
</html>
