<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">

    <title>Recuperar contraseña | Gym Tracker</title>

    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="icon" href="/img/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/img/favicon-180.png">
    <meta name="theme-color" content="#c92f4b">
    <!-- App instalable (PWA): ficha de la app e icono/barra en iPhone -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Gym Tracker">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>
    <!--
        Paso 1 de la recuperación: pedimos el email y Supabase envía un enlace.
        Al pulsarlo, el usuario llega a /nueva-contrasena (nueva-contrasena.html).
    -->
    <main class="auth-page">
        <section class="auth-card">
            <a href="/" class="auth-logo">Gym Tracker</a>
            <h1>Recuperar contraseña</h1>
            <p class="auth-subtitle">Escribe el email de tu cuenta y te enviaremos un enlace para crear una contraseña nueva.</p>

            <form id="recuperarForm">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="name@email.com" autocomplete="email" required>
                <button type="submit" class="button" id="submitBtn">Enviar enlace</button>
            </form>
            <p id="mensaje" class="auth-message" role="status" aria-live="polite"></p>
            <div class="auth-footer">
                ¿Te has acordado?
                <a href="/login">Volver a iniciar sesión</a>
            </div>
        </section>
    </main>
    <script th:src="@{/js/vendor/supabase-2.117.2.min.js}"></script>
    <script th:src="@{/js/supabase.js}"></script>
    <script th:src="@{/js/auth-session.js}"></script>
    <script th:src="@{/js/auth-ui.js}"></script>
    <script th:src="@{/js/pwa.js}"></script>
    <script th:src="@{/js/recuperar.js}"></script>
</body>
</html>
