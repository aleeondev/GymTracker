spring.application.name=gymtracker
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Página de privacidad (/privacidad): responsable de los datos y email de contacto.
# Son públicos (salen en la web).
# OJO: Spring lee este archivo como ISO-8859-1, así que las tildes se escriben con
# su código Unicode: \u00e1 = á, \u00e9 = é, \u00ed = í, \u00f3 = ó, \u00fa = ú, \u00f1 = ñ.
app.responsable.nombre=Alejandro Le\u00f3n
app.contacto.email=gymtraacker.app@gmail.com

# Proyecto de Supabase (la URL es pública; se usa para verificar los tokens de login)
supabase.url=https://ywtbjfndqwhgpndkjbue.supabase.co
# Clave SECRETA de Supabase (solo servidor): la usa "Eliminar mi cuenta" para borrar
# la cuenta de acceso. Nunca escribirla aquí: va en application-local.properties
# (ignorado por git) o en la variable de entorno SUPABASE_SECRET_KEY de Render.
supabase.secret-key=${SUPABASE_SECRET_KEY:}
# Tipo correcto para la ficha de la app instalable (static/manifest.webmanifest)
server.mime-mappings.webmanifest=application/manifest+json

# Versionado automático de CSS y JS: cada archivo se sirve con una "huella" de su
# contenido en el nombre (app.css -> app-3f9a1c....css). Si el archivo cambia,
# cambia la huella y el navegador descarga el nuevo. Ya no hace falta poner ?v=...
# Solo funciona en los enlaces escritos con Thymeleaf: th:href="@{/css/app.css}".
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**

# Páginas de error propias (templates/error/*.html). Nunca enseñar detalles técnicos:
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

