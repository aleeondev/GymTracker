spring.application.name=gymtracker
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Proyecto de Supabase (la URL es pública; se usa para verificar los tokens de login)
supabase.url=https://ywtbjfndqwhgpndkjbue.supabase.co
# Tipo correcto para la ficha de la app instalable (static/manifest.webmanifest)
server.mime-mappings.webmanifest=application/manifest+json
