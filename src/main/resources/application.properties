spring.application.name=gymtracker
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Proyecto de Supabase (la URL es pública; se usa para verificar los tokens de login)
supabase.url=https://ywtbjfndqwhgpndkjbue.supabase.co
# Tipo correcto para la ficha de la app instalable (static/manifest.webmanifest)
server.mime-mappings.webmanifest=application/manifest+json

# Versionado automático de CSS y JS: cada archivo se sirve con una "huella" de su
# contenido en el nombre (app.css -> app-3f9a1c....css). Si el archivo cambia,
# cambia la huella y el navegador descarga el nuevo. Ya no hace falta poner ?v=...
# Solo funciona en los enlaces escritos con Thymeleaf: th:href="@{/css/app.css}".
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**

# Páginas de error propias (templates/error/*.html). Nunca enseñar detalles técnicos:
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

